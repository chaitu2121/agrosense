<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroSense – Instruments</title>
  <link rel="stylesheet" href="rm-style.css">
</head>
<body>

  <div class="loading-first" id="rm-loader">
    <div class="title title--h3" style="letter-spacing: 4px;">AGROSENSE</div>
  </div>

  <div class="layout">
    
    <header>
      <div class="overflow">
        <div style="opacity: 0.5;">[ SYSTEM ACTIVE ]</div>
        <div class="title title--h4" style="font-weight: 500;">AGROSENSE</div>
        <div style="opacity: 0.5;"><a href="index.html" style="color:#fff; text-decoration:none;">EXIT</a></div>
      </div>
    </header>

    <div class="container">
      
      <div class="breadcrumb">
        <div class="breadcrumb__item">Instruments <span style="margin: 0 12px; color: #515151;">/</span> Dashboard Analytics</div>
      </div>

      <section class="form__group" id="riskTool">
        <h2 class="title title--h2">01. Risk Predictor</h2>
        <p class="text text--body3">Execute probabilistic failure analysis before capital allocation.</p>
        
        <div class="form__cols">
          <div class="form__col">
            <select id="season" class="form__input form__input--dark">
              <option value="" disabled selected>Select Season</option>
              <option value="monsoon">Monsoon (Kharif)</option>
              <option value="winter">Winter (Rabi)</option>
              <option value="summer">Summer</option>
            </select>
          </div>
          <div class="form__col">
            <select id="crop" class="form__input form__input--dark">
              <option value="" disabled selected>Select Crop</option>
              <option value="wheat">Wheat</option>
              <option value="cotton">Cotton</option>
            </select>
          </div>
          <div class="form__col">
            <select id="soil" class="form__input form__input--dark">
              <option value="" disabled selected>Soil Composition</option>
              <option value="black">Black Soil</option>
              <option value="red">Red Soil</option>
            </select>
          </div>
          <div class="form__col">
            <select id="water" class="form__input form__input--dark">
              <option value="" disabled selected>Water Infrastructure</option>
              <option value="rain">Rainfed Only</option>
              <option value="borewell">Borewell</option>
            </select>
          </div>
        </div>
        
        <div style="margin-top: 15px;">
          <button class="link-button" onclick="analyzeRisk()">Initialize Analysis</button>
        </div>
        
        <div class="rm-result-box" id="riskResult">[ AWAITING PARAMETERS ]</div>
      </section>

      <section class="form__group" id="waterTool">
        <h2 class="title title--h2">02. Water Budget</h2>
        <p class="text text--body3">Calculate hydration requirements against available resources.</p>
        
        <div class="form__cols">
          <div class="form__col">
            <select id="w_crop" class="form__input form__input--dark">
              <option value="" disabled selected>Target Crop</option>
              <option value="wheat">Wheat</option>
              <option value="cotton">Cotton</option>
            </select>
          </div>
          <div class="form__col">
            <input type="number" id="w_acres" class="form__input form__input--dark" placeholder="Land Volume (Acres)" />
          </div>
          <div class="form__col">
            <select id="w_source" class="form__input form__input--dark">
              <option value="" disabled selected>Water Source</option>
              <option value="rain">Rainfed</option>
              <option value="borewell">Borewell</option>
            </select>
          </div>
        </div>

        <div style="margin-top: 15px;">
          <button class="link-button" onclick="calcWater()">Calculate Capacity</button>
        </div>
        
        <div class="rm-result-box" id="waterResult">[ AWAITING PARAMETERS ]</div>
      </section>
      
      <div style="height: 100px;"></div>

    </div>
  </div>

  <script src="tools.js"></script>
  
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('rm-loader').classList.add('inactive');
      }, 800); 
    });
  </script>
</body>
</html>
